name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix hosts/openclaw ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build:ui
      - run: npm run validate
